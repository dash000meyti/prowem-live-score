name: event-care

x-api-environment: &api-environment
    APP_NAME: PROWEM Event Care API
    APP_ENV: production
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env.production}
    APP_DEBUG: "false"
    APP_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env.production}
    FRONTEND_URL: ${PUBLIC_URL}
    FRONTEND_URL_ALT: ${PUBLIC_URL}
    PUBLIC_API_DOCS: ${PUBLIC_API_DOCS:-false}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-warning}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: ${DB_DATABASE:-event_care}
    DB_USERNAME: ${DB_USERNAME:-event_care}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: ${REVERB_APP_ID:-event-care}
    REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env.production}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env.production}
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: "8080"

x-api-service: &api-service
    image: event-care-api:${IMAGE_TAG:-latest}
    build:
        context: ./apps/api
        dockerfile: Dockerfile
        target: production
    restart: unless-stopped
    environment: *api-environment
    volumes:
        - api-storage:/var/www/html/storage

services:
    gateway:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            - "${HTTP_PORT:-80}:80"
        volumes:
            - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            api-nginx:
                condition: service_healthy
            web:
                condition: service_healthy
            reverb:
                condition: service_healthy
        networks:
            - backend
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 20s

    api:
        <<: *api-service
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - backend
            - data
        healthcheck:
            test: ["CMD-SHELL", "php-fpm -t || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5

    api-nginx:
        image: event-care-api-nginx:${IMAGE_TAG:-latest}
        build:
            context: ./apps/api
            dockerfile: docker/nginx/Dockerfile
        restart: unless-stopped
        depends_on:
            api:
                condition: service_healthy
        networks:
            - backend

    queue:
        <<: *api-service
        command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=30
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - data
        healthcheck:
            test: ["CMD-SHELL", "grep -aq 'queue:work' /proc/1/cmdline || exit 1"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s

    reverb:
        <<: *api-service
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - backend
            - data
        healthcheck:
            test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',8080,$$errno,$$errstr,2); if(!$$s){exit(1);} fclose($$s);"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s

    web:
        image: event-care-web:${IMAGE_TAG:-latest}
        build:
            context: .
            dockerfile: apps/web/Dockerfile
            target: production
            args:
                NEXT_PUBLIC_REVERB_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env.production}
                NEXT_PUBLIC_REVERB_PORT: ${PUBLIC_REVERB_PORT:-80}
                NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY}
                NEXT_PUBLIC_REVERB_SCHEME: ${PUBLIC_SCHEME:-http}
        restart: unless-stopped
        environment:
            API_INTERNAL_URL: http://api-nginx
            AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
        depends_on:
            api-nginx:
                condition: service_healthy
        networks:
            - backend

    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-event_care}
            POSTGRES_USER: ${DB_USERNAME:-event_care}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./apps/api/docker/postgres/init:/docker-entrypoint-initdb.d:ro
        networks:
            - data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        networks:
            - data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

networks:
    backend:
    data:
        internal: true

volumes:
    api-storage:
    postgres-data:
    redis-data:
