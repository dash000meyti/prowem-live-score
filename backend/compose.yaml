services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "php-fpm -t || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 3

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "127.0.0.1:${FORWARD_HTTP_PORT:-18080}:80"
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: tournament
            MYSQL_USER: tournament
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "${FORWARD_DB_PORT:-3306}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    reverb:
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /var/www/html
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        restart: unless-stopped
        ports:
            - "127.0.0.1:18081:8080"
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        healthcheck:
            test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',8080,$$errno,$$errstr,2); if(!$$s){exit(1);} fclose($$s);"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s

    queue:
        build:
            context: .
            dockerfile: Dockerfile
        working_dir: /var/www/html
        command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=30
        restart: unless-stopped
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "grep -aq 'queue:work' /proc/1/cmdline || exit 1"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 10s

volumes:
    mysql-data:
    redis-data:
    vendor:
