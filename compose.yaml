name: event-care

services:
    app:
        image: event-care-api:dev
        build:
            context: ./apps/api
            dockerfile: Dockerfile
            target: development
        restart: unless-stopped
        volumes:
            - ./apps/api:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "php-fpm -t || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 3

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "127.0.0.1:${FORWARD_HTTP_PORT:-18090}:80"
        volumes:
            - ./apps/api/public:/var/www/html/public:ro
            - ./apps/api/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: event_care
            POSTGRES_USER: event_care
            POSTGRES_PASSWORD: secret
        ports:
            - "127.0.0.1:${FORWARD_DB_PORT:-15432}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./apps/api/docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U event_care -d event_care"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - "127.0.0.1:${FORWARD_REDIS_PORT:-16379}:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    reverb:
        image: event-care-api:dev
        build:
            context: ./apps/api
            dockerfile: Dockerfile
            target: development
        working_dir: /var/www/html
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        restart: unless-stopped
        ports:
            - "127.0.0.1:${FORWARD_REVERB_PORT:-18091}:8080"
        volumes:
            - ./apps/api:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',8080,$$errno,$$errstr,2); if(!$$s){exit(1);} fclose($$s);"]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s

    queue:
        image: event-care-api:dev
        build:
            context: ./apps/api
            dockerfile: Dockerfile
            target: development
        working_dir: /var/www/html
        command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=30
        restart: unless-stopped
        volumes:
            - ./apps/api:/var/www/html
            - vendor:/var/www/html/vendor
        depends_on:
            app:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "grep -aq 'queue:work' /proc/1/cmdline || exit 1"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 10s

    web:
        image: event-care-web:dev
        build:
            context: .
            dockerfile: apps/web/Dockerfile
            target: development
        working_dir: /repo
        restart: unless-stopped
        ports:
            - "127.0.0.1:${FORWARD_WEB_PORT:-3000}:3000"
        volumes:
            - .:/repo
            - root-node-modules:/repo/node_modules
            - web-node-modules:/repo/apps/web/node_modules
        environment:
            API_INTERNAL_URL: http://nginx
            AUTH_COOKIE_SECURE: "false"
            NEXT_PUBLIC_REVERB_HOST: 127.0.0.1
            NEXT_PUBLIC_REVERB_PORT: ${FORWARD_REVERB_PORT:-18091}
            NEXT_PUBLIC_REVERB_APP_KEY: event-care-key
            NEXT_PUBLIC_REVERB_SCHEME: http
        depends_on:
            nginx:
                condition: service_healthy

volumes:
    postgres-data:
    redis-data:
    vendor:
    root-node-modules:
    web-node-modules:
