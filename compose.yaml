services:
    app:
        build:
            context: .
            dockerfile: Dockerfile

        restart: unless-stopped

        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor

        depends_on:
            mysql:
                condition: service_healthy

            redis:
                condition: service_healthy
        healthcheck:
            test: [ "CMD-SHELL", "php-fpm -t || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 3


    nginx:
        image: nginx:alpine

        restart: unless-stopped

        ports:
            - "127.0.0.1:${FORWARD_HTTP_PORT:-18080}:80"

        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

        depends_on:
            - app
        healthcheck:
            test:
              [
                  "CMD-SHELL",
                  "wget -q --spider http://127.0.0.1/up || exit 1"
              ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    mysql:
        image: mysql:8.4

        restart: unless-stopped

        environment:
            MYSQL_DATABASE: tournament
            MYSQL_USER: tournament
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root

        ports:
            - "${FORWARD_DB_PORT:-3306}:3306"

        volumes:
            - mysql-data:/var/lib/mysql

        healthcheck:
            test:
              [
                  "CMD",
                  "mysqladmin",
                  "ping",
                  "-h",
                  "127.0.0.1",
                  "-uroot",
                  "-proot"
              ]
            interval: 5s
            timeout: 5s
            retries: 10


    redis:
        image: redis:7-alpine

        restart: unless-stopped

        ports:
            - "127.0.0.1:6379:6379"

        volumes:
            - redis-data:/data

        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    mysql-data:
    redis-data:
    vendor:
